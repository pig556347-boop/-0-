<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">폐교탈출 운동장 기획 1안</title><desc id="desc">아직 구현하지 않은 84미터 곱하기 66미터 개략도. 북쪽 본관 현관에서 운동장 좌우 우회로와 중앙 길을 지나 남쪽 교문으로 연결된다. 서관 별관 산책로는 향후 연결 후보로 막혀 있다.</desc>
