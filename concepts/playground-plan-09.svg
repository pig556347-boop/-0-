<path d="M55 1029H105" stroke="#e9d08a" stroke-width="4" stroke-dasharray="9 7"/><text x="117" y="1035" font-size="16">좌우 우회</text><path d="M283 1029H333" stroke="#8cc2bb" stroke-width="4" stroke-dasharray="9 7"/><text x="345" y="1035" font-size="16">중앙 가로지름</text><rect x="551" y="1019" width="26" height="17" fill="#445b40" stroke="#a0aa88"/><text x="589" y="1035" font-size="16">시야 차폐·양쪽 우회</text>
<text x="54" y="1073" font-size="15" fill="#c4c9bb">현재 1층 임시 교문 성공 유지. 운동장 런타임·서관·별관 개방·새 괴이는 이 도면으로 구현하지 않음.</text>
