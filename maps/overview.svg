<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1145" viewBox="0 0 1200 1145"><style>text{font-family:"Noto Sans CJK KR","Noto Sans CJK",sans-serif}</style><rect x="0" y="0" width="1200" height="1145" rx="0" fill="#101e27" stroke="none" /><text x="46" y="49" font-size="32" fill="#e5e9dd" text-anchor="start" font-weight="bold">폐교탈출 · 전체 맵 전개도</text><text x="46" y="82" font-size="17" fill="#b2c1b9" text-anchor="start" font-weight="normal">현재 구현한 본관과 향후 운동장 연결을 구분한 구조도</text><rect x="255" y="125" width="690" height="185" rx="10" fill="#304b55" stroke="#89a8a5" /><text x="287" y="165" font-size="25" fill="#e5e9dd" text-anchor="start" font-weight="bold">본관 3층 · 17개 방</text><text x="287" y="201" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">3학년 교실·빈교실 / 3학년 교무실</text><text x="287" y="229" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">휴게실·상담실·메인회의실·교장실·중앙통제실</text><text x="287" y="257" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">학생·교직원 화장실 / 중앙 굴절·분기 통로</text><rect x="255" y="370" width="690" height="185" rx="10" fill="#304b55" stroke="#89a8a5" /><text x="287" y="410" font-size="25" fill="#e5e9dd" text-anchor="start" font-weight="bold">본관 2층 · 22개 방</text><text x="287" y="446" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">교실·음악실·도서실·미술실·미술실 창고</text><text x="287" y="474" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">컴퓨터실·준비실·자료실·창고·2학년 교무실</text><text x="287" y="502" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">학생·교직원 화장실 / 중앙은 막힌 공간</text><rect x="255" y="615" width="690" height="185" rx="10" fill="#304b55" stroke="#89a8a5" /><text x="287" y="655" font-size="25" fill="#e5e9dd" text-anchor="start" font-weight="bold">본관 1층 · 14개 방</text><text x="287" y="691" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">현관·중앙홀·복도 / 빈교실·행정실·보건실·방송실</text><text x="287" y="719" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">창고·대회의실·설비관리실·세미나실</text><text x="287" y="747" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">학생·교직원 화장실 / 현관의 임시 교문에서 현재 탈출</text><path d="M600 318 V357 M592 327 L600 318 L608 327 M592 348 L600 357 L608 348" fill="none" stroke="#e4c572" stroke-width="3"/><text x="629" y="343" font-size="16" fill="#e4c572" text-anchor="start" font-weight="normal">계단으로 왕복 · 자동 이동</text><path d="M600 563 V602 M592 572 L600 563 L608 572 M592 593 L600 602 L608 593" fill="none" stroke="#e4c572" stroke-width="3"/><text x="629" y="588" font-size="16" fill="#e4c572" text-anchor="start" font-weight="normal">계단으로 왕복 · 자동 이동</text><rect x="30" y="421" width="190" height="89" rx="8" fill="#2c3035" stroke="#d68c7e" /><text x="125" y="454" font-size="22" fill="#e5e9dd" text-anchor="middle" font-weight="bold">서관</text><text x="125" y="482" font-size="14" fill="#d68c7e" text-anchor="middle" font-weight="normal">연결 통로 끝 봉쇄</text><path d="M220 466 H255" stroke="#d68c7e" stroke-width="3" stroke-dasharray="7 5"/><rect x="980" y="421" width="190" height="89" rx="8" fill="#2c3035" stroke="#d68c7e" /><text x="1075" y="454" font-size="22" fill="#e5e9dd" text-anchor="middle" font-weight="bold">별관</text><text x="1075" y="482" font-size="14" fill="#d68c7e" text-anchor="middle" font-weight="normal">연결 통로 끝 봉쇄</text><path d="M945 466 H980" stroke="#d68c7e" stroke-width="3" stroke-dasharray="7 5"/><rect x="980" y="155" width="190" height="83" rx="8" fill="#2c3035" stroke="#d68c7e" /><text x="1075" y="187" font-size="21" fill="#e5e9dd" text-anchor="middle" font-weight="bold">옥상</text><text x="1075" y="215" font-size="14" fill="#d68c7e" text-anchor="middle" font-weight="normal">연결부 봉쇄</text><path d="M945 197 H980" stroke="#d68c7e" stroke-width="3" stroke-dasharray="7 5"/><path d="M600 814 V858" stroke="#e4c572" stroke-width="3" stroke-dasharray="8 6"/><text x="629" y="843" font-size="16" fill="#e4c572" text-anchor="start" font-weight="normal">향후 현관 E 출입 · 현재는 기획</text><rect x="255" y="870" width="690" height="155" rx="10" fill="#343a2f" stroke="#e4c572" stroke-dasharray="10 7"/><text x="287" y="912" font-size="25" fill="#e4c572" text-anchor="start" font-weight="bold">운동장 · 기획 1안</text><text x="287" y="948" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">약 84 × 66m / 중앙 길 + 좌우 우회로 / 차폐물 2곳</text><text x="287" y="982" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">남쪽 교문에서 최종 탈출하도록 연결할 계획</text><text x="46" y="1072" font-size="16" fill="#b2c1b9" text-anchor="start" font-weight="normal">실선: 현재 구현 · 점선: 기획 또는 봉쇄 연결</text><text x="46" y="1105" font-size="16" fill="#b2c1b9" text-anchor="start" font-weight="normal">본관 53개 방은 E로 입장하는 독립 실내입니다. 운동장은 아직 실행 맵이 아닙니다.</text></svg>