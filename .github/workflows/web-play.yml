name: Build and publish web game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: web-game
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check activation secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
      - name: Build Unity WebGL
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.10f1
          targetPlatform: WebGL
          buildMethod: HUDCIBuild.Build
      - name: Report Unity compiler diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          logs = [Path('unity-build.log')]
          bee = Path('Library/Bee')
          if bee.exists(): logs.extend(bee.rglob('*.log'))
          found = set()
          for path in logs:
            if not path.is_file(): continue
            for line in path.read_text(errors='replace').splitlines():
              if re.search(r'\berror CS[0-9]+\b', line) and line not in found:
                found.add(line)
                print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          print('::notice::Compiler diagnostics found: ' + str(len(found)))
          PY
      - name: Validate web output
        run: |
          # Unity builder runs in a container and leaves root-owned output.
          # The browser test publishes its verified screenshot with the game.
          sudo chown -R "$(id -u):$(id -g)" build/WebGL
          test -s build/WebGL/index.html
          test -n "$(find build/WebGL/Build -name '*.wasm' -size +0c -print -quit)"
          test -n "$(find build/WebGL/Build -name '*.data' -size +0c -print -quit)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run real Unity HUD browser tests
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
          python3 -m http.server 8780 --bind 127.0.0.1 --directory build > /tmp/hud-http.log 2>&1 &
          node Tests/HUD/browser-test.cjs
      - name: Publish motion verification evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'verification';
            if (!fs.existsSync('hud-test-results')) return;
            const passed = fs.existsSync('hud-test-results/summary.json');
            try {
              await github.rest.git.getRef({...context.repo, ref: 'heads/' + branch});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...context.repo, ref: 'refs/heads/' + branch, sha: context.sha});
            }
            for (const name of fs.readdirSync('hud-test-results').filter(n => /\.(png|json)$/.test(n))) {
              const path = passed ? 'verification/' + name : 'verification/runs/' + context.runId + '/' + name;
              let sha;
              try {
                const result = await github.rest.repos.getContent({...context.repo, path, ref: branch});
                sha = result.data.sha;
              } catch (error) { if (error.status !== 404) throw error; }
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo, branch, path, sha,
                message: 'Record ' + (passed ? 'passed' : 'failed') + ' game execution ' + context.sha.substring(0, 7),
                content: fs.readFileSync('hud-test-results/' + name).toString('base64')
              });
            }
      - name: Upload HUD execution screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-test-results
          path: hud-test-results
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish successful build
        id: deployment
        uses: actions/deploy-pages@v4
