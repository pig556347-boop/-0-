name: Build and publish web game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-game
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check activation secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
      - name: Build Unity WebGL
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.10f1
          targetPlatform: WebGL
          buildMethod: HUDCIBuild.Build
      - name: Validate web output
        run: |
          test -s build/WebGL/index.html
          test -n "$(find build/WebGL/Build -name '*.wasm' -size +0c -print -quit)"
          test -n "$(find build/WebGL/Build -name '*.data' -size +0c -print -quit)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run real Unity HUD browser tests
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8780 --bind 127.0.0.1 --directory build > /tmp/hud-http.log 2>&1 &
          node Tests/HUD/browser-test.cjs
      - name: Upload HUD execution screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-test-results
          path: hud-test-results
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish successful build
        id: deployment
        uses: actions/deploy-pages@v4
