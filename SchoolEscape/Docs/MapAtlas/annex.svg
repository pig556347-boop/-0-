<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img"><title>별관 · 급식실과 통층 체육관 전개도</title>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif}</style>
<rect x="0" y="0" width="1400" height="1000" fill="#101e27" stroke="none" rx="0" />
<text x="40" y="48" font-size="30" fill="#e5e9dd" text-anchor="start" font-weight="bold">별관 · 급식실 / 2~3층 통층 체육관</text>
<text x="40" y="83" font-size="17" fill="#b2c1b9" text-anchor="start" font-weight="normal">사용자 스케치 기반 · 각 방은 E로 이동하는 독립 공간 · 계단은 자동 왕복</text>
<rect x="360" y="122" width="650" height="220" fill="#304b55" stroke="#91c8c3" rx="8" />
<text x="685" y="175" font-size="25" fill="#e5e9dd" text-anchor="middle" font-weight="bold">체육관 · 2~3층 높이를 통으로 사용</text>
<text x="685" y="215" font-size="18" fill="#e5e9dd" text-anchor="middle" font-weight="normal">코트 / 농구대 / 무대 / 관람 벤치 / 높은 창문</text>
<text x="685" y="255" font-size="18" fill="#e4c572" text-anchor="middle" font-weight="normal">중간 3층 바닥 없음 · 천장 높이 7.6m</text>
<polyline points="685,342 685,385" fill="none" stroke="#91c8c3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<rect x="310" y="385" width="800" height="75" fill="#718879" stroke="#91c8c3" rx="8" />
<text x="710" y="431" font-size="23" fill="#101e27" text-anchor="middle" font-weight="bold">별관 2층 공용 복도</text>
<rect x="25" y="385" width="245" height="75" fill="#304b55" stroke="#91c8c3" rx="8" />
<text x="147" y="417" font-size="18" fill="#e5e9dd" text-anchor="middle" font-weight="normal">본관 2층 동쪽</text>
<text x="147" y="443" font-size="17" fill="#91c8c3" text-anchor="middle" font-weight="normal">긴 연결통로 → E</text>
<polyline points="270,423 310,423" fill="none" stroke="#91c8c3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<rect x="30" y="510" width="310" height="78" fill="#304b55" stroke="#91c8c3" rx="6" />
<text x="185" y="556" font-size="20" fill="#e5e9dd" text-anchor="middle" font-weight="bold">학생 화장실 남</text>
<rect x="375" y="510" width="310" height="78" fill="#304b55" stroke="#91c8c3" rx="6" />
<text x="530" y="556" font-size="20" fill="#e5e9dd" text-anchor="middle" font-weight="bold">학생 화장실 여</text>
<rect x="720" y="510" width="310" height="78" fill="#304b55" stroke="#91c8c3" rx="6" />
<text x="875" y="556" font-size="20" fill="#e5e9dd" text-anchor="middle" font-weight="bold">체력단련실</text>
<rect x="1065" y="510" width="310" height="78" fill="#304b55" stroke="#91c8c3" rx="6" />
<text x="1220" y="556" font-size="20" fill="#e5e9dd" text-anchor="middle" font-weight="bold">체육용품 창고</text>
<rect x="30" y="620" width="310" height="78" fill="#304b55" stroke="#91c8c3" rx="6" />
<text x="185" y="666" font-size="20" fill="#e5e9dd" text-anchor="middle" font-weight="bold">작은 제어실</text>
<rect x="375" y="620" width="310" height="78" fill="#304b55" stroke="#91c8c3" rx="6" />
<text x="530" y="666" font-size="20" fill="#e5e9dd" text-anchor="middle" font-weight="bold">학생휴게실</text>
<rect x="720" y="620" width="310" height="78" fill="#304b55" stroke="#91c8c3" rx="6" />
<text x="875" y="666" font-size="20" fill="#e5e9dd" text-anchor="middle" font-weight="bold">체육 이론 교실</text>
<rect x="1065" y="620" width="310" height="78" fill="#304b55" stroke="#91c8c3" rx="6" />
<text x="1220" y="666" font-size="20" fill="#e5e9dd" text-anchor="middle" font-weight="bold">체조·무용 실습실</text>
<text x="700" y="735" font-size="18" fill="#b2c1b9" text-anchor="middle" font-weight="normal">위 시설은 모두 2층 공용 복도에서 출입합니다.</text>
<polyline points="1160,425 1320,425 1320,812" fill="none" stroke="#e4c572" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<text x="1215" y="780" font-size="18" fill="#e4c572" text-anchor="middle" font-weight="normal">↕ 자동 계단</text>
<rect x="340" y="812" width="670" height="125" fill="#304b55" stroke="#e4c572" rx="8" />
<text x="675" y="859" font-size="24" fill="#e5e9dd" text-anchor="middle" font-weight="bold">별관 1층 · 급식실</text>
<text x="675" y="898" font-size="18" fill="#b2c1b9" text-anchor="middle" font-weight="normal">식탁 12개 / 배식대 / 우회 통로</text>
<rect x="1040" y="840" width="300" height="90" fill="#304b55" stroke="#91c8c3" rx="8" />
<text x="1190" y="892" font-size="21" fill="#e5e9dd" text-anchor="middle" font-weight="normal">급식실 창고 · E</text>
<polyline points="1010,885 1040,885" fill="none" stroke="#91c8c3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
</svg>
