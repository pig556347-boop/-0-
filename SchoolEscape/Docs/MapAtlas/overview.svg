<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1195" viewBox="0 0 1200 1195" role="img"><title>폐교탈출 전체 맵 전개도</title>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif}</style>
<rect x="0" y="0" width="1200" height="1195" fill="#101e27" stroke="none" rx="0" />
<text x="46" y="49" font-size="32" fill="#e5e9dd" text-anchor="start" font-weight="bold">폐교탈출 · 전체 맵 전개도</text>
<text x="46" y="82" font-size="17" fill="#b2c1b9" text-anchor="start" font-weight="normal">본관 53개 실내 + 별관 12개 공간 + 운동장 · 현재 실행 지도 연결 구조</text>
<rect x="255" y="125" width="690" height="165" fill="#304b55" stroke="#89a8a5" rx="10" />
<text x="287" y="165" font-size="25" fill="#e5e9dd" text-anchor="start" font-weight="bold">본관 3층 · 17개 방</text>
<text x="287" y="203" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">3학년 교실·빈교실 / 교무실·휴게실·상담실</text>
<text x="287" y="233" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">메인회의실·교장실·중앙통제실 / 화장실</text>
<polyline points="600,298 600,336" fill="none" stroke="#e4c572" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<text x="629" y="323" font-size="16" fill="#e4c572" text-anchor="start" font-weight="normal">↕ 계단으로 왕복 · 자동 이동</text>
<rect x="255" y="350" width="690" height="165" fill="#304b55" stroke="#89a8a5" rx="10" />
<text x="287" y="390" font-size="25" fill="#e5e9dd" text-anchor="start" font-weight="bold">본관 2층 · 22개 방</text>
<text x="287" y="428" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">교실·음악실·도서실·미술실·미술실 창고</text>
<text x="287" y="458" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">컴퓨터실·준비실·자료실·창고·교무실 / 화장실</text>
<polyline points="600,523 600,561" fill="none" stroke="#e4c572" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<text x="629" y="548" font-size="16" fill="#e4c572" text-anchor="start" font-weight="normal">↕ 계단으로 왕복 · 자동 이동</text>
<rect x="255" y="575" width="690" height="165" fill="#304b55" stroke="#89a8a5" rx="10" />
<text x="287" y="615" font-size="25" fill="#e5e9dd" text-anchor="start" font-weight="bold">본관 1층 · 14개 방</text>
<text x="287" y="653" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">현관·중앙홀 / 빈교실·행정실·보건실·방송실</text>
<text x="287" y="683" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">창고·대회의실·설비관리실·세미나실 / 화장실</text>
<rect x="30" y="396" width="190" height="89" fill="#2c3035" stroke="#d68c7e" rx="8" />
<text x="125" y="430" font-size="22" fill="#e5e9dd" text-anchor="middle" font-weight="bold">서관</text>
<text x="125" y="459" font-size="14" fill="#d68c7e" text-anchor="middle" font-weight="normal">연결 통로 끝 봉쇄</text>
<polyline points="220,440 255,440" fill="none" stroke="#d68c7e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<rect x="980" y="396" width="190" height="89" fill="#2c3035" stroke="#d68c7e" rx="8" />
<text x="1075" y="430" font-size="22" fill="#e5e9dd" text-anchor="middle" font-weight="bold">별관</text>
<text x="1075" y="459" font-size="14" fill="#91c8c3" text-anchor="middle" font-weight="normal">2층 E 출입</text>
<polyline points="945,440 980,440" fill="none" stroke="#91c8c3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<rect x="980" y="155" width="190" height="83" fill="#2c3035" stroke="#d68c7e" rx="8" />
<text x="1075" y="187" font-size="21" fill="#e5e9dd" text-anchor="middle" font-weight="bold">옥상</text>
<text x="1075" y="215" font-size="14" fill="#d68c7e" text-anchor="middle" font-weight="normal">연결부 봉쇄</text>
<polyline points="945,197 980,197" fill="none" stroke="#d68c7e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<polyline points="600,750 600,802" fill="none" stroke="#91c8c3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<text x="629" y="780" font-size="16" fill="#91c8c3" text-anchor="start" font-weight="normal">↕ 현관 E 출입 · 양방향 연결</text>
<rect x="255" y="815" width="690" height="185" fill="#343f34" stroke="#94b18d" rx="10" />
<text x="287" y="856" font-size="25" fill="#e4c572" text-anchor="start" font-weight="bold">운동장 · 독립된 실제 야외 공간</text>
<text x="287" y="892" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">약 83.75 × 66.25m · 중앙 길 + 좌우 우회로</text>
<text x="287" y="924" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">북쪽: 본관 현관 왕복 · 남쪽: 유일한 탈출 교문</text>
<text x="287" y="956" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">A·B·C 열쇠는 본관과 운동장에 나누어 배치</text>
<polyline points="600,1007 600,1035" fill="none" stroke="#e4c572" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<rect x="380" y="1045" width="440" height="58" fill="#514631" stroke="#e4c572" rx="8" />
<text x="600" y="1081" font-size="21" fill="#e4c572" text-anchor="middle" font-weight="bold">남쪽 교문 · A + B + C로 탈출</text>
<text x="46" y="1140" font-size="16" fill="#b2c1b9" text-anchor="start" font-weight="normal">실선: 현재 연결 · 점선: 봉쇄 연결 · 모든 방과 현관은 기본 닫힌 E 문</text>
<text x="46" y="1171" font-size="16" fill="#b2c1b9" text-anchor="start" font-weight="normal">운동장 출입은 탈출이 아닙니다. 세 열쇠를 모아 남쪽 교문에서 E를 누르세요.</text>
</svg>
