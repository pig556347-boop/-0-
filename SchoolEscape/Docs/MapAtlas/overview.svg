<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1460" viewBox="0 0 1200 1460" role="img"><title>폐교탈출 4층 확장 전개도</title>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif}</style>
<rect x="0" y="0" width="1200" height="1460" fill="#101e27" stroke="none" rx="0" />
<text x="45" y="50" font-size="32" fill="#e5e9dd" text-anchor="start" font-weight="bold">폐교탈출 · 본관 4층 확장</text>
<text x="45" y="86" font-size="18" fill="#b2c1b9" text-anchor="start" font-weight="normal">본관 67개 방 + 옥상 / 서관 14 / 별관 18 / 운동장·산책로·교문 경비실</text>
<rect x="250" y="230" width="700" height="145" fill="#304b55" stroke="#91c8c3" rx="8" />
<text x="280" y="272" font-size="27" fill="#e5e9dd" text-anchor="start" font-weight="bold">본관 4층</text>
<text x="280" y="315" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">3학년 1~6반 · 3학년 교무실 · 컴퓨터실 · 미술실</text>
<polyline points="600,375 600,445" fill="none" stroke="#e4c572" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<rect x="250" y="445" width="700" height="145" fill="#304b55" stroke="#91c8c3" rx="8" />
<text x="280" y="487" font-size="27" fill="#e5e9dd" text-anchor="start" font-weight="bold">본관 3층</text>
<text x="280" y="530" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">2학년 1~6반 · 2학년 교무실 · 과학실·음악실·도서실</text>
<polyline points="600,590 600,660" fill="none" stroke="#e4c572" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<rect x="250" y="660" width="700" height="145" fill="#304b55" stroke="#91c8c3" rx="8" />
<text x="280" y="702" font-size="27" fill="#e5e9dd" text-anchor="start" font-weight="bold">본관 2층</text>
<text x="280" y="745" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">1학년 1~6반 · 교무실 · 학생회실 · 기술가정실 · 화장실</text>
<polyline points="600,805 600,875" fill="none" stroke="#e4c572" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<rect x="250" y="875" width="700" height="145" fill="#304b55" stroke="#91c8c3" rx="8" />
<text x="280" y="917" font-size="27" fill="#e5e9dd" text-anchor="start" font-weight="bold">본관 1층</text>
<text x="280" y="960" font-size="17" fill="#e5e9dd" text-anchor="start" font-weight="normal">현관 · 행정실 · 보건실 · 방송실 · 상담실 · 빈교실 2개</text>
<rect x="420" y="115" width="360" height="65" fill="#304b55" stroke="#e4c572" rx="8" />
<text x="600" y="156" font-size="21" fill="#e4c572" text-anchor="middle" font-weight="normal">옥상 · 4층 계단 + 카드키</text>
<polyline points="600,180 600,230" fill="none" stroke="#e4c572" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<rect x="25" y="680" width="195" height="90" fill="#304b55" stroke="#91c8c3" rx="8" />
<text x="123" y="718" font-size="25" fill="#e5e9dd" text-anchor="middle" font-weight="normal">서관</text>
<text x="123" y="746" font-size="14" fill="#91c8c3" text-anchor="middle" font-weight="normal">2층 연결 통로 유지</text>
<polyline points="220,725 250,725" fill="none" stroke="#91c8c3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<rect x="980" y="680" width="195" height="90" fill="#304b55" stroke="#91c8c3" rx="8" />
<text x="1078" y="718" font-size="25" fill="#e5e9dd" text-anchor="middle" font-weight="normal">별관</text>
<text x="1078" y="746" font-size="14" fill="#91c8c3" text-anchor="middle" font-weight="normal">2층 연결 통로 유지</text>
<polyline points="950,725 980,725" fill="none" stroke="#91c8c3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<polyline points="600,1020 600,1080" fill="none" stroke="#91c8c3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/>
<rect x="250" y="1080" width="700" height="145" fill="#304b55" stroke="#91c8c3" rx="8" />
<text x="600" y="1120" font-size="26" fill="#e5e9dd" text-anchor="middle" font-weight="normal">운동장 · 기존 크기 유지</text>
<text x="600" y="1156" font-size="18" fill="#e5e9dd" text-anchor="middle" font-weight="normal">동쪽: 산책로 순환 동선 / 남서쪽: 교문 경비실</text>
<text x="600" y="1190" font-size="18" fill="#e4c572" text-anchor="middle" font-weight="normal">북쪽 현관 E 왕복 · 남쪽 교문 A+B+C 탈출</text>
<text x="45" y="1300" font-size="20" fill="#b2c1b9" text-anchor="start" font-weight="normal">실내는 E 문으로 개별 전환 / 계단은 걸어 들어가 자동 이동</text>
<text x="45" y="1340" font-size="20" fill="#b2c1b9" text-anchor="start" font-weight="normal">층 카드키 순서: 1층 → 2층 → 3층 → 4층 → 옥상</text>
<text x="45" y="1380" font-size="20" fill="#b2c1b9" text-anchor="start" font-weight="normal">각 학년 6반 · 교무실 10석(담임 6 + 과목교사 4) · 가구 크기는 유지</text>
</svg>
