name: Verify separate school escape web play

on:
  push:
    branches: [school-escape-web]
    paths:
      - index.html
      - verify-web.mjs
      - verify-subjects.mjs
      - verify-lobby.mjs
      - .github/workflows/verify-web-play.yml

permissions:
  contents: write

concurrency:
  group: school-escape-web-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: school-escape-web
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify public HTML and real browser controls
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_path" ]; then
            node -e 'require("node:fs").writeFileSync("published-status.json",JSON.stringify({ok:false,utc:new Date().toISOString(),error:"No Chrome/Chromium installed on runner",sourceCommit:process.env.PUBLIC_GAME_COMMIT||process.env.GITHUB_SHA,workflowCommit:process.env.GITHUB_SHA},null,2)+"\n")'
            exit 1
          fi
          SKIP_SHOTS=1 CHROMIUM_PATH="$chrome_path" node verify-web.mjs
      - name: Save verification report on this branch only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = school-escape-web
          if [ ! -f published-status.json ]; then
            node -e 'require("node:fs").writeFileSync("published-status.json",JSON.stringify({ok:false,utc:new Date().toISOString(),error:"Verification did not produce a report",sourceCommit:process.env.PUBLIC_GAME_COMMIT||process.env.GITHUB_SHA,workflowCommit:process.env.GITHUB_SHA},null,2)+"\n")'
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- published-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record public web play verification [skip ci]"
            git push origin HEAD:refs/heads/school-escape-web
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-escape-public-web-proof
          path: |
            published-status.json
            proof/**
            upgrade-*.png
            annex-*.png
            *-014.png
            failure.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail the workflow if public verification failed
        if: always()
        run: node -e 'const s=JSON.parse(require("node:fs").readFileSync("published-status.json"));if(!s.ok)process.exit(1)'
